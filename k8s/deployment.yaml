apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes-app-dev
  labels:
    app: notes-app
    environment: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
        environment: dev
    spec:
      containers:
        - name: notes-app
          image: <account-id>.dkr.ecr.us-east-1.amazonaws.com/notes-app-shared:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notes-app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-app-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: "128m"
              memory: "256Mi"
            limits:
              cpu: "512m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
      restartPolicy: Always
